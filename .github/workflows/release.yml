name: release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            container: gcc:15
            cmake: -DKK_STATIC=ON
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            container: gcc:15
            cmake: -DKK_STATIC=ON
          - name: android-aarch64
            runner: ubuntu-24.04
            cmake: -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=24
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo=$(command -v sudo || true)
          $sudo apt-get update -q && $sudo apt-get install -yq cmake ninja-build
      - uses: actions/cache@v4
        with:
          path: weights
          key: weights-${{ hashFiles('CMakeLists.txt') }}
      - run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DKK_EMBED=ON -DCMAKE_EXE_LINKER_FLAGS=-s ${{ matrix.cmake }}
      - run: cmake --build build --target kk
      - if: matrix.container
        run: |
          build/kk -i "The quick brown fox jumps over the lazy dog." -o smoke.wav
          test $(stat -c %s smoke.wav) -gt 50000
      - run: mv build/kk kk-${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: kk-${{ matrix.name }}
          path: kk-${{ matrix.name }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" kk-* --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
